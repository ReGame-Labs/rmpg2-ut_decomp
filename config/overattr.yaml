# splat config for the overlay OVERLAYS/OVERATTR.BIN (docs/DISC_LAYOUT.md "Overlays"): loaded at 0x80097EA4 by the
# executable, linked with it as a psylink overlay group (absolute calls both ways). The executable's names come from
# build/exe_symbols.txt (configure.py writes it from config/symbol_addrs.txt); this overlay's own names are in
# config/overattr.symbols.txt. Run through configure.py.
name: OVERATTR.BIN
sha1: cc94a54eecf5cf5d1c9a6317f4ba1182ba75dc3e
options:
  basename: OVERATTR.BIN
  base_path: ..
  target_path: extracted/disc/OVERLAYS/OVERATTR.BIN
  elf_path: build/overattr/OVERATTR.BIN.elf
  platform: psx
  compiler: GCC

  build_path: build/overattr
  asm_path: asm/overattr
  src_path: src/overattr
  asset_path: assets/overattr
  ld_script_path: build/overattr/OVERATTR.BIN.ld
  symbol_addrs_path:
    - config/overattr.symbols.txt
    - build/exe_symbols.txt
  create_undefined_funcs_auto: True
  undefined_funcs_auto_path: build/overattr/undefined_funcs_auto.txt
  create_undefined_syms_auto: True
  undefined_syms_auto_path: build/overattr/undefined_syms_auto.txt

  # The overlays were linked with the executable: the same $gp, never used (-G0).
  gp_value: 0x80097EA4
  # psylink puts each object's .rodata before all .text.
  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]
  # The overlay's .bss, if any, is inside the file (zeros at its end) and loaded with it.
  ld_bss_is_noload: False
  # psylink packs objects at 4-byte alignment; GNU as would give every section 16.
  subalign: 4
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  find_file_boundaries: True
  migrate_rodata_to_functions: True
  use_legacy_include_asm: False
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  # Also write a full .s for each c segment: assembled, it is objdiff's "target" object.
  make_full_disasm_for_code: True
  generate_asm_macros_files: True
  generated_asm_macros_directory: include/asm_generated

segments:
  - name: overattr
    type: code
    start: 0x0
    vram: 0x80097EA4
    subsegments:
      # Three game files and a data-only object. In this overlay psylink starts each object's .rodata and .text
      # 8-aligned (configure.py align_overlay_sections): the zero words at 0x80097F34 and 0x80097F54 (.rodata) and at
      # 0x80099114 and 0x8009B474 (.text, after a function's last instruction) are that padding, and the two
      # sections agree on the two boundaries. The jump tables (all 0 mod 8) need their object to start 8-aligned.
      # Each file's .rodata is in the order of its .text (docs/MATCHING.md "Splitting a target into files").
      - [0x0, rodata, rodata_80097EA4]        # 0x80097EA4 the word 11, used by nothing: an object of its own (the jump tables after it need an 8-aligned start)
      - [0x4, .rodata, card]                  # 0x80097EA8 the save file's name BASLUS-00742RAMPAGE, the jump tables of func_80098848/func_80098A48, the save title
      - [0x94, .rodata, overattr_80099118]    # 0x80097F38 "??????", "NOOB MYUKUS", "WINS" (func_800991EC), then the pad word 0x80097F54
      - [0xB4, .rodata, menu]                 # 0x80097F58 the movie names (the strings of the table at 0x800A72D8, last element first), then the users in text order to the end
      - [0x88C, c, card]                      # 0x80098730 the memory-card file: MemCard* wrappers, the save header, ASCII to Shift-JIS
      - [0x1274, c, overattr_80099118]        # 0x80099118 after the pad word 0x80099114: the pad edges, the attract screens
      - [0x35D4, c, menu]                     # 0x8009B478 after the pad word 0x8009B474: the credits, the menus and the memory-card screens
      - [0xB4BC, data, data]                  # 0x800A3360 .data, then zeros from 0x800A92A4: the overlay's .bss, inside the file

  - [0x11A1C]
