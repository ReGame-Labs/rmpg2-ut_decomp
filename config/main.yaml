      - [0x5A2C8, asm, psyq/libcd/event]        # 0x80069AC8 CdInit, def_cbsync, def_cbready...; 4.3-4.7
      - [0x5A418, asm, psyq/libpad/padportm]    # 0x80069C18 PadInitMtap; 4.3 only
      - [0x5AC78, asm, psyq/libapi/a37]         # 0x8006A478 ExitCriticalSection
      - [0x5AC88, asm, psyq/libgpu/p01]         # 0x8006A488 GetClut
