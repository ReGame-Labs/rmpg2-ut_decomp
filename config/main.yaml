# splat config for the boot executable SLUS_007.42 (Rampage 2: Universal Tour, USA).
# Memory map: docs/DISC_LAYOUT.md. Library boundaries: tools/psyq_match.py (docs/TOOLCHAIN.md).
# Run through configure.py (it splits, then writes build.ninja), or by hand:
#   tools/venv/bin/splat split config/main.yaml
#
# Overlays get their own config/<name>.yaml with the same layout of paths (asm/<name>/, src/<name>/, build/<name>/)
# and link against this executable's symbols.
name: SLUS_007.42
sha1: 3cb8f02ac807c1cf74a94e5df19a03633a14d962
options:
  basename: SLUS_007.42
  base_path: ..
  target_path: extracted/disc/SLUS_007.42
  elf_path: build/main/SLUS_007.42.elf
  platform: psx
  compiler: GCC

  build_path: build/main
  asm_path: asm/main
  src_path: src/main
  asset_path: assets/main
  ld_script_path: build/main/SLUS_007.42.ld
  symbol_addrs_path:
    - config/symbol_addrs.txt
  create_undefined_funcs_auto: True
  undefined_funcs_auto_path: build/main/undefined_funcs_auto.txt
  create_undefined_syms_auto: True
  undefined_syms_auto_path: build/main/undefined_syms_auto.txt

  # crt0 (2MBYTE.OBJ at 0x80017758) sets $gp to 0x80097EA4, the end of .data; the code makes no $gp-relative access
  # (everything -G0, no .sdata/.sbss).
  gp_value: 0x80097EA4
  # psylink puts each object's .rodata before all .text.
  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]
  # .bss is not in the file (the header has no bss fields): it is the `bss` segment below, cleared by crt0, after the
  # overlay region (docs/DISC_LAYOUT.md "Memory map").
  ld_bss_is_noload: True
  # psylink packs objects at 4-byte alignment; GNU as would give every section 16.
  subalign: 4
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  find_file_boundaries: True
  migrate_rodata_to_functions: True
  use_legacy_include_asm: False
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  # Also write a full .s for each c segment: assembled, it is objdiff's "target" object.
  make_full_disasm_for_code: True
  generate_asm_macros_files: True
  generated_asm_macros_directory: include/asm_generated

segments:
  - name: header
    type: header
    start: 0x0

  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    subsegments:
      # The regions (docs/DISC_LAYOUT.md "The executable"). The game's code is to be split into its source files
      # with evidence (docs/MATCHING.md "Splitting a target into files"); the Psy-Q libraries are one unit per
      # library object, named by signature (tools/psyq_match.py, docs/TOOLCHAIN.md), never decompiled.
      - [0x800, rodata, rodata]        # 0x80010000 .rodata of every object, in link order (psylink)
      - [0x7F58, asm, crt0]            # 0x80017758 Psy-Q 2MBYTE.OBJ: the entry point (0x80017760), calls main
      - [0x801C, asm, game]            # 0x8001781C the game's code, main first
      # The Psy-Q objects, in link order: psyq/<library>/<object>. Each holds only the functions the game references
      # (the linker dropped the rest), so a unit is often shorter than the library's object; the names come from
      # per-function signature matching (tools/psyq_match.py --functions). Four pieces of the game's own code sit
      # between library objects: the linker pulled them from the game's own library during the same passes.
      - [0x54278, asm, psyq/libapi/c57]         # 0x80063A78 InitHeap; the InitHeap stub crt0 calls, placed between game objects
      - [0x54288, asm, game_80063A88]           # 0x80063A88 game code: the SPU setup (SpuInit, SpuSetReverbModeParam...), linked after the first library object
      - [0x547A8, asm, psyq/libcd/c_011]        # 0x80063FA8 StCdInterrupt
      - [0x55298, asm, psyq/libcd/c_003]        # 0x80064A98 StUnSetRing
      - [0x55318, asm, psyq/libgpu/sys]         # 0x80064B18 ResetGraph, SetGraphDebug, SetDispMask...; sys.c $Id 1998/01/12; 17 of 36 functions kept
      - [0x57918, asm, psyq/libcd/cdread2]      # 0x80067118 CdRead2, StCdInterrupt2
      - [0x579C8, asm, psyq/libcd/c_005]        # 0x800671C8 StSetStream
      - [0x57A58, asm, psyq/libcd/cdrom]        # 0x80067258 StSetRing
      - [0x57A88, asm, psyq/libcd/c_009]        # 0x80067288 StGetNext
      - [0x57B48, asm, psyq/libcd/sys]          # 0x80067348 CdStatus, CdMode, CdLastPos...; CdFlush/CdSync/CdReady by their CD_* callees
      - [0x58128, asm, psyq/libcd/c_007]        # 0x80067928 StFreeRing
      - [0x581D8, asm, psyq/libetc/vsync]       # 0x800679D8 VSync
      - [0x583E8, asm, psyq/libgpu/ext]         # 0x80067BE8 SetDefDrawEnv, SetDefDispEnv
      - [0x584D8, asm, psyq/libspu/s_sm]        # 0x80067CD8 SpuSetMute
      - [0x58538, asm, psyq/libmcrd/libmcrd]    # 0x80067D38 MemCardInit, MemCardStart, MemCardExist...; 14 of 19 functions kept
      - [0x59860, asm, psyq/libc2/memset]       # 0x80069060 memset
      - [0x59890, asm, psyq/libapi/counter]     # 0x80069090 SetRCnt, GetRCnt, StartRCnt; 3 of 5 functions kept
      - [0x59994, asm, psyq/libetc/intr]        # 0x80069194 ResetCallback, InterruptCallback, DMACallback...; intr.c $Id 1997/02/07; 7 of 10 entry points kept
      - [0x59FDC, asm, psyq/libapi/a91]         # 0x800697DC ChangeClearPAD
      - [0x59FEC, asm, psyq/libgte/reg13]       # 0x800697EC SetGeomScreen
      - [0x59FFC, asm, psyq/libgte/msc00]       # 0x800697FC InitGeom; 4.3 only
