name: Bug report
description: Something is wrong in the build, the tools or the documentation.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search the [open issues](https://github.com/ReGame-Labs/rmpg2-wt/issues) first.
        **Never attach game files, a disc image or anything extracted from the disc.**
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Building the matching game (setup, extract, build)
        - A matched function that is wrong
        - Tools or scripts
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit
      description: The commit you built (`git rev-parse --short HEAD`).
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Distribution and version, Python version.
      placeholder: Ubuntu 24.04, Python 3.12
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Output
      description: The terminal output of the failing command.
      render: text
